name: Build PNGTree Zipper

on:
  release:
    types: [ published, edited ]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update 'latest' Tag"
    types:
      - completed

permissions:
  contents: write

jobs:
  build-windows:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout latest tag when triggered by Update latest Tag
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          git fetch --tags
          git checkout tags/latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows executable
        run: pyinstaller --onefile --noupx --icon=pngtree.ico --name=Pngtree_Zipper pngtree_zipper.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PNGTree-Zipper-Windows
          path: dist/Pngtree_Zipper.exe
          if-no-files-found: error

      - name: Upload to Release
        if: github.event_name == 'release' || github.event_name == 'workflow_run'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pngtree_Zipper.exe
          tag_name: ${{ github.event_name == 'workflow_run' && 'latest' || github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: PNGTree-Zipper-Windows
          failOnError: false

  build-linux:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout latest tag when triggered by Update latest Tag
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          git fetch --tags
          git checkout tags/latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller

      - name: Build Linux executable with PyInstaller
        run: |
          pyinstaller --onefile --noupx \
            --name=Pngtree_Zipper \
            pngtree_zipper.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PNGTree-Zipper-Linux
          path: dist/Pngtree_Zipper
          if-no-files-found: error

      - name: Upload to Release
        if: github.event_name == 'release' || github.event_name == 'workflow_run'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pngtree_Zipper
          tag_name: ${{ github.event_name == 'workflow_run' && 'latest' || github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: PNGTree-Zipper-Linux
          failOnError: false
